services:
  - type: web
    name: pws-omsetning-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: pws-omsetning-db
          property: connectionString
      - key: PWS_APP_KEY
        sync: false
      - key: PWS_INGEST_KEY
        sync: false

databases:
  - name: pws-omsetning-db
    plan: free
